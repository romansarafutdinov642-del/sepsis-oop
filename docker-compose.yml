services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_DB: research
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U research -d research"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INCLUDE_ML: ${INCLUDE_ML:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://research@postgres:5432/research
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      UPLOAD_DIR: /app/storage/xrays
      MODEL_PATH: /app/models
      TORCH_HOME: /app/.cache/torch
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage/xrays:/app/storage/xrays
      - ./models:/app/models:ro
      - torch_cache:/app/.cache/torch
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  torch_cache:
